name: .NET 11 consumer compatibility
on:
  pull_request:
    paths:
      - '.github/workflows/dotnet11-*.yml'
      - 'tests/dotnet11/**'
      - 'tests/sdk-install/Consumer/**'
      - 'tests/sdk-install/Ownership/**'
      - 'tests/sdk-install/verify.py'
      - 'tests/sdk-install/loader_fixture.c'
permissions:
  contents: read
jobs:
  compatibility:
    uses: ./.github/workflows/dotnet11-worker.yml
    with:
      source_commit: ${{ github.event.pull_request.head.sha }}
