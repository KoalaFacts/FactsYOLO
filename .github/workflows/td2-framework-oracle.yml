name: TD2 framework reference oracle
on:
  pull_request:
    paths:
      - 'experiments/td2-framework/**'
      - 'experiments/cpu-detector/evaluate/src/bin/td2_proxy.rs'
      - 'experiments/cpu-detector/Cargo.toml'
      - 'experiments/cpu-detector/Cargo.lock'
      - 'experiments/cpu-detector/evaluate/Cargo.toml'
      - '.github/workflows/td2-framework-oracle.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/td2-framework/**'
      - 'experiments/cpu-detector/evaluate/src/bin/td2_proxy.rs'
      - 'experiments/cpu-detector/Cargo.toml'
      - 'experiments/cpu-detector/Cargo.lock'
      - 'experiments/cpu-detector/evaluate/Cargo.toml'
      - '.github/workflows/td2-framework-oracle.yml'
concurrency:
  # A newer push to the same pull request supersedes the older run; main runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  independent-reference:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: windows-2022
            python: python
    steps:
      - name: Fetch exact public commit without credentials
        shell: bash
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "${{ matrix.python }}" experiments/td2-framework/verify_ci_source.py --event "$GITHUB_EVENT_NAME" --checkout "$GITHUB_SHA" --source "${{ github.event.pull_request.head.sha || github.sha }}" --base "${{ github.event.pull_request.base.sha || '' }}" --output td2-ci-source.json
      - name: Verify independent forward and finite-difference gradients
        shell: bash
        run: |
          "${{ matrix.python }}" -m unittest discover -s experiments/td2-framework -p 'test_*.py' -v
          "${{ matrix.python }}" experiments/td2-framework/reference_oracle.py --output td2-b-oracle.json
          "${{ matrix.python }}" -c 'import json; d=json.load(open("td2-b-oracle.json",encoding="utf-8")); assert not d["framework_selected"] and not d["training_executed"]; assert len(d["outputs"])==32'
      - name: Preserve numerical reference values
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: td2-oracle-${{ matrix.os }}
          path: |
            td2-b-oracle.json
            td2-ci-source.json
          if-no-files-found: error
  real-rust-autodiff:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: windows-2022
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_TERM_COLOR: never
      RAYON_NUM_THREADS: '1'
    steps:
      - name: Check out exact public commit
        shell: bash
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "${{ matrix.python }}" experiments/td2-framework/verify_ci_source.py --event "$GITHUB_EVENT_NAME" --checkout "$GITHUB_SHA" --source "${{ github.event.pull_request.head.sha || github.sha }}" --base "${{ github.event.pull_request.base.sha || '' }}" --output td2-ci-source.json
      - name: Install pinned Rust and fetch existing evaluation lockfile
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          cargo fetch --manifest-path experiments/cpu-detector/Cargo.toml --locked
      - name: Compile both real framework graphs, compare forward and autodiff
        shell: bash
        run: |
          "${{ matrix.python }}" -m unittest discover -s experiments/td2-framework -p "test_*.py" -v
          "${{ matrix.python }}" experiments/td2-framework/reference_oracle.py --output td2-b-oracle.json
          cargo test --manifest-path experiments/cpu-detector/Cargo.toml --locked --offline --release --bin td2_proxy
          cargo build --manifest-path experiments/cpu-detector/Cargo.toml --locked --offline --release --bin td2_proxy
          for backend in burn candle; do
            cargo run --manifest-path experiments/cpu-detector/Cargo.toml --locked --offline --release --quiet --bin td2_proxy -- "$backend" td2-b-oracle.json > "td2-$backend.json"
            "${{ matrix.python }}" experiments/td2-framework/verify_backend.py "$backend" td2-b-oracle.json "td2-$backend.json" --output "td2-$backend-comparison.json"
          done
      - name: Check matched 20-step Rust autodiff with externally applied SGD
        shell: bash
        run: |
          exe=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe=".exe"; fi
          bin="experiments/cpu-detector/target/release/td2_proxy${exe}"
          for backend in burn candle; do
            "${{ matrix.python }}" experiments/td2-framework/td2_native_sgd_replay.py --binary "$bin" --backend "$backend" --output "td2-$backend-20step-sgd.json"
          done
      - name: Check matched 20-step in-process framework SGD (stage B3a)
        shell: bash
        run: |
          for backend in burn candle; do
            cargo run --manifest-path experiments/cpu-detector/Cargo.toml --locked --offline --release --quiet --bin td2_proxy -- "$backend" td2-b-oracle.json --sgd 20 0.002 > "td2-$backend-inprocess-sgd.json"
            "${{ matrix.python }}" experiments/td2-framework/verify_training.py "$backend" "td2-$backend-inprocess-sgd.json" --output "td2-$backend-inprocess-sgd-comparison.json"
          done
      - name: Check matched 20-step in-process frozen AdamW recipe (stage B3b)
        shell: bash
        run: |
          for backend in burn candle; do
            cargo run --manifest-path experiments/cpu-detector/Cargo.toml --locked --offline --release --quiet --bin td2_proxy -- "$backend" td2-b-oracle.json --adamw-recipe 20 > "td2-$backend-inprocess-adamw.json"
            "${{ matrix.python }}" experiments/td2-framework/verify_training.py "$backend" "td2-$backend-inprocess-adamw.json" --adamw-recipe --output "td2-$backend-inprocess-adamw-comparison.json"
            cargo run --manifest-path experiments/cpu-detector/Cargo.toml --locked --offline --release --quiet --bin td2_proxy -- "$backend" td2-b-oracle.json --adamw-recipe 20 0.8 > "td2-$backend-inprocess-adamw-clip.json"
            "${{ matrix.python }}" experiments/td2-framework/verify_training.py "$backend" "td2-$backend-inprocess-adamw-clip.json" --adamw-recipe --clip-norm 0.8 --output "td2-$backend-inprocess-adamw-clip-comparison.json"
          done
      - name: Preserve exact numerical evidence (no weights or pixels)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: td2-real-autodiff-${{ matrix.os }}
          path: |
            td2-b-oracle.json
            td2-ci-source.json
            td2-burn.json
            td2-candle.json
            td2-burn-comparison.json
            td2-candle-comparison.json
            td2-burn-20step-sgd.json
            td2-candle-20step-sgd.json
            td2-burn-inprocess-sgd.json
            td2-candle-inprocess-sgd.json
            td2-burn-inprocess-sgd-comparison.json
            td2-candle-inprocess-sgd-comparison.json
            td2-burn-inprocess-adamw.json
            td2-candle-inprocess-adamw.json
            td2-burn-inprocess-adamw-comparison.json
            td2-candle-inprocess-adamw-comparison.json
            td2-burn-inprocess-adamw-clip.json
            td2-candle-inprocess-adamw-clip.json
            td2-burn-inprocess-adamw-clip-comparison.json
            td2-candle-inprocess-adamw-clip-comparison.json
          if-no-files-found: ignore
  cpu-throughput:
    # Stage B4: CPU throughput and peak memory of the scaled proxy graph on
    # free x64 and arm64 runners. Numbers only; no weights or pixels.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out exact public commit
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust and fetch existing evaluation lockfile
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo fetch --manifest-path experiments/cpu-detector/Cargo.toml --locked
      - name: Measure 20 SGD steps per backend, one thread and all threads
        shell: bash
        run: |
          cargo build --manifest-path experiments/cpu-detector/Cargo.toml --locked --offline --release --bin td2_proxy
          bin=experiments/cpu-detector/target/release/td2_proxy
          nproc > td2-b4-nproc.txt
          for backend in burn candle; do
            RAYON_NUM_THREADS=1 "$bin" "$backend" --bench 20 > "td2-b4-$backend-1thread.json"
            "$bin" "$backend" --bench 20 > "td2-b4-$backend-allthreads.json"
          done
      - name: Check both backends trained the same values and reported memory
        shell: bash
        run: |
          command -v jq >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q jq; }
          for threads in 1thread allthreads; do
            jq -e -n --slurpfile a "td2-b4-burn-$threads.json" --slurpfile b "td2-b4-candle-$threads.json" '
              ($a[0].losses | length) > 0
              and ($a[0].losses | length) == ($b[0].losses | length)
              and ([range(0; $a[0].losses | length) as $i
                    | ($a[0].losses[$i] - $b[0].losses[$i]) | fabs] | max) < 1e-4
              and ($a[0].peak_rss_bytes > 0) and ($b[0].peak_rss_bytes > 0)'
          done
      - name: Preserve throughput and memory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: td2-b4-throughput-${{ matrix.os }}
          path: |
            td2-b4-*.json
            td2-b4-nproc.txt
          if-no-files-found: ignore
