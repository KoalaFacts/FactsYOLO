name: Native contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust: '1.99.0'
          - os: ubuntu-24.04
            rust: '1.85.0'
          - os: windows-2022
            rust: '1.99.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_TERM_COLOR: never
      FACTSYOLO_BUILD_ID: ${{ github.sha }}
    steps:
      - name: Fetch exact public commit without credentials
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version --verbose
          cargo --version
      - name: Discover Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'MSVC tools unavailable' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          # Git Bash prepends its Unix link.exe; pin Cargo to the MSVC linker.
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (!(Test-Path $linker)) { throw 'MSVC linker unavailable' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCINSTALLDIR','WindowsSdkDir','WindowsSDKVersion','UniversalCRTSdkDir','UCRTVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Fixture tests in isolated target directory
        run: |
          cargo test --workspace --no-fail-fast --features contract-fixtures --target-dir target/contract-fixtures --locked --offline
          cargo test --workspace --no-fail-fast --features contract-fixtures --target-dir target/contract-fixtures --locked --offline --release
      - name: Debug tests
        run: cargo test --workspace --no-fail-fast --locked --offline
      - name: Release tests
        run: cargo test --workspace --no-fail-fast --locked --offline --release
      - name: Build native libraries
        run: |
          cargo build -p facts-yolo --locked --offline --release
          cargo build -p facts-yolo --features contract-fixtures --target-dir target/contract-fixtures --locked --offline --release
      - name: C dynamic and static smoke tests and fixture isolation
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude tests/c/abi_query.c -Ltarget/release -lfacts_yolo -Wl,-rpath,"$PWD/target/release" -o target/c-dynamic
          target/c-dynamic
          gcc -std=c11 -Wall -Wextra -Werror -DFY_STATIC -Iinclude tests/c/abi_query.c target/release/libfacts_yolo.a -ldl -lpthread -lm -lrt -lutil -o target/c-static
          target/c-static
          nm -D --defined-only target/release/libfacts_yolo.so | awk '{print $3}' | grep '^fy_' | LC_ALL=C sort > target/normal-symbols.txt
          diff -u tests/c/public-symbols.txt target/normal-symbols.txt
          { cat tests/c/public-symbols.txt; printf '%s\n' fy_test_model_create fy_test_session_wait_running fy_test_session_resume fy_test_resource_counts; } | LC_ALL=C sort > target/fixture-expected.txt
          nm -D --defined-only target/contract-fixtures/release/libfacts_yolo.so | awk '{print $3}' | grep '^fy_' | LC_ALL=C sort > target/fixture-symbols.txt
          diff -u target/fixture-expected.txt target/fixture-symbols.txt
      - name: C ownership consumers against normal and test libraries
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude tests/c/ownership.c -Ltarget/release -lfacts_yolo -Wl,-rpath,"$PWD/target/release" -o target/c-ownership-normal
          target/c-ownership-normal
          gcc -std=c11 -Wall -Wextra -Werror -DFY_STATIC -Iinclude tests/c/ownership.c target/release/libfacts_yolo.a -ldl -lpthread -lm -lrt -lutil -o target/c-ownership-normal-static
          target/c-ownership-normal-static
          gcc -std=c11 -Wall -Wextra -Werror -DFY_TEST_FIXTURES -Iinclude -Itests/fixtures tests/c/ownership.c -Ltarget/contract-fixtures/release -lfacts_yolo -Wl,-rpath,"$PWD/target/contract-fixtures/release" -o target/c-ownership-fixture
          target/c-ownership-fixture
          gcc -std=c11 -Wall -Wextra -Werror -DFY_STATIC -DFY_TEST_FIXTURES -Iinclude -Itests/fixtures tests/c/ownership.c target/contract-fixtures/release/libfacts_yolo.a -ldl -lpthread -lm -lrt -lutil -o target/c-ownership-fixture-static
          target/c-ownership-fixture-static
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo clippy --workspace --all-targets --features contract-fixtures --target-dir target/contract-fixtures --locked --offline -- -D warnings
      - name: Format
        if: always() && matrix.rust == '1.99.0'
        run: |
          cargo fmt --all -- --check || { cargo fmt --all; git diff; exit 1; }
