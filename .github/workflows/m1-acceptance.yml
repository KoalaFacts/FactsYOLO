name: M1 acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.99.0'
  FACTSYOLO_BUILD_ID: ${{ github.sha }}
  CARGO_TERM_COLOR: never
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  local-target:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Fetch exact public commit without credentials
        shell: bash
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'
      - name: Discover Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'MSVC tools unavailable' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCINSTALLDIR','WindowsSdkDir','WindowsSDKVersion','UniversalCRTSdkDir','UCRTVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Fetch locked optional native dependencies
        shell: bash
        run: cargo fetch --locked
      - name: Execute every mandatory local-target gate
        shell: pwsh
        run: |
          cargo run -p xtask --locked --offline -- verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-${{ matrix.os }}
          path: |
            target/m1-evidence/**/*.txt
            target/m1-evidence/**/*.tsv
            target/m1-evidence/**/*.log
            target/m1-evidence/**/*.bin
            target/m1-evidence/**/*.o
            target/c-conformance/**/*layout.txt
            target/normal/release/verified-exports.txt
            target/contract-fixtures/release/verified-exports.txt
          if-no-files-found: error
  miri-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact public commit without credentials
        shell: bash
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install exact stable and Miri toolchains
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup toolchain install nightly-2026-10-13 --profile minimal --component miri
      - name: Fetch locked optional native dependencies
        shell: bash
        run: cargo fetch --locked
      - name: Interpret backed descriptors and ownership under Miri
        run: cargo run -p xtask --locked --offline -- miri
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-miri
          path: |
            target/m1-evidence/**/*.txt
            target/m1-evidence/**/*.tsv
            target/m1-evidence/**/*.log
            target/m1-evidence/**/*.bin
            target/m1-evidence/**/*.o
            target/c-conformance/**/*layout.txt
            target/normal/release/verified-exports.txt
            target/contract-fixtures/release/verified-exports.txt
          if-no-files-found: error
  miri-td1:
    runs-on: ubuntu-24.04
    # Full TD1 Miri interpretation is much slower than native tests.
    timeout-minutes: 90
    steps:
      - name: Fetch exact public commit without credentials
        shell: bash
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install exact stable and Miri toolchains
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup toolchain install nightly-2026-10-13 --profile minimal --component miri
      - name: Fetch locked optional native dependencies
        shell: bash
        run: cargo fetch --locked
      - name: Interpret actual TD1 model parsing, images and ownership
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/miri-td1-evidence
          # Run the new parity regression first so an actual panic is visible
          # immediately, instead of being hidden by later tests on timeout.
          # Then execute every remaining TD1 test exactly once (no gate skip).
          cargo +nightly-2026-10-13 miri test -p facts-yolo --features td1 --test td1 --locked --offline -- --exact native_td1_matches_portable_predictions_across_images_formats_and_row_strides --nocapture 2>&1 | tee target/miri-td1-evidence/tests.log
          cargo +nightly-2026-10-13 miri test -p facts-yolo --features td1 --test td1 --locked --offline -- --skip native_td1_matches_portable_predictions_across_images_formats_and_row_strides --nocapture 2>&1 | tee -a target/miri-td1-evidence/tests.log
      - name: Preserve TD1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-miri-td1
          path: target/miri-td1-evidence/tests.log
          if-no-files-found: error
  safety:
    # Keep the existing gate name; neither suite may fail, cancel or skip.
    needs: [miri-contracts, miri-td1]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both Miri suites
        env:
          CONTRACT_RESULT: ${{ needs.miri-contracts.result }}
          TD1_RESULT: ${{ needs.miri-td1.result }}
        run: |
          test "$CONTRACT_RESULT" = success
          test "$TD1_RESULT" = success
  layout32:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact public commit without credentials
        shell: bash
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install compiler and target support
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add i686-unknown-linux-gnu --toolchain 1.99.0
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-multilib
      - name: Fetch locked optional native dependencies
        shell: bash
        run: cargo fetch --locked
      - name: Compare ELF32 compiler records (no execution support claim)
        run: cargo run -p xtask --locked --offline -- layout32
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-i686-layout
          path: |
            target/m1-evidence/**/*.txt
            target/m1-evidence/**/*.tsv
            target/m1-evidence/**/*.log
            target/m1-evidence/**/*.bin
            target/m1-evidence/**/*.o
            target/c-conformance/**/*layout.txt
            target/normal/release/verified-exports.txt
            target/contract-fixtures/release/verified-exports.txt
          if-no-files-found: error
