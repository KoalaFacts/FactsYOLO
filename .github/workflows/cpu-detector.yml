name: CPU detector experiment
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.99.0'
  FACTSYOLO_BUILD_ID: ${{ github.sha }}
  CARGO_TERM_COLOR: never
  RAYON_NUM_THREADS: '1'
jobs:
  train-save-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact public commit without credentials
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install exact evaluation and portable toolchains
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.85.0 --profile minimal
      - name: Fetch pinned crates from the Cargo registry
        run: cargo fetch --manifest-path experiments/cpu-detector/Cargo.toml --locked
      - name: Execute real training and fresh-process inference gates
        run: python3 experiments/cpu-detector/verify.py experiments/cpu-detector/target/evidence
      - name: Preserve commands, losses and metrics (no weight or pixel upload)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-detector-evidence
          path: |
            experiments/cpu-detector/target/evidence/**/*.json
            experiments/cpu-detector/target/evidence/**/*.log
            experiments/cpu-detector/target/evidence/**/*.tsv
          if-no-files-found: error
