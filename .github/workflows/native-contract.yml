name: Native contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust: '1.99.0'
          - os: ubuntu-24.04
            rust: '1.85.0'
          - os: windows-2022
            rust: '1.99.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_TERM_COLOR: never
    steps:
      - name: Fetch exact public commit without credentials
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version --verbose
          cargo --version
      - name: Debug tests
        run: cargo test --workspace --locked --offline
      - name: Release tests
        run: cargo test --workspace --locked --offline --release
      - name: Build native libraries
        run: cargo build -p facts-yolo --locked --offline --release
      - name: C dynamic and static smoke tests
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude tests/c/abi_query.c -Ltarget/release -lfacts_yolo -Wl,-rpath,"$PWD/target/release" -o target/c-dynamic
          target/c-dynamic
          gcc -std=c11 -Wall -Wextra -Werror -DFY_STATIC -Iinclude tests/c/abi_query.c target/release/libfacts_yolo.a -ldl -lpthread -lm -lrt -lutil -o target/c-static
          target/c-static
          test "$(nm -D --defined-only target/release/libfacts_yolo.so | awk '{print $3}' | grep '^fy_')" = fy_abi_query
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Format
        if: always() && matrix.rust == '1.99.0'
        run: |
          cargo fmt --all -- --check || { cargo fmt --all; git diff; exit 1; }
