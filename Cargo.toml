[workspace]
members = ["crates/facts-yolo", "xtask"]
resolver = "3"
exclude = ["experiments/cpu-detector/model"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
