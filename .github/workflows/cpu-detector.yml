name: CPU detector experiment
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.99.0'
  FACTSYOLO_BUILD_ID: ${{ github.sha }}
  CARGO_TERM_COLOR: never
  RAYON_NUM_THREADS: '1'
jobs:
  train-save-reload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: windows-2022
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact public commit without credentials
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Reject malformed full-training benchmark reports
        run: |
          ${{ matrix.python }} -m unittest discover -s experiments/cpu-detector -p 'test_full_training_gate.py' -v
      - name: Install exact evaluation and portable toolchains
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.85.0 --profile minimal
      - name: Discover existing Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'MSVC x64 tools unavailable' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCINSTALLDIR','WindowsSdkDir','WindowsSDKVersion','UniversalCRTSdkDir','UCRTVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
          Get-Command cl, dumpbin | Format-Table Name, Source
      - name: Fetch pinned crates from the Cargo registry
        run: |
          cargo fetch --manifest-path experiments/cpu-detector/Cargo.toml --locked
          cargo fetch --locked
      - name: Install pinned .NET SDK for actual native consumers
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'
      - name: Execute real training and fresh-process inference gates
        # Git Bash prepends its GNU link.exe; preserve the discovered MSVC PATH.
        shell: pwsh
        run: |
          ${{ matrix.python }} experiments/cpu-detector/verify.py experiments/cpu-detector/target/evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute trained artifacts through C and C# JIT/Native AOT
        shell: pwsh
        run: |
          ${{ matrix.python }} experiments/cpu-detector/verify_native.py experiments/cpu-detector/target/evidence/burn target/td1-evidence-burn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ${{ matrix.python }} experiments/cpu-detector/verify_native.py experiments/cpu-detector/target/evidence/candle target/td1-evidence-candle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact pre-immutable-inference TD1 Linux baseline
        if: runner.os == 'Linux'
        run: |
          # Historical baseline is the reviewed pre-#36 head, not
          # a synthesized or edited old library. Both versions compile
          # on the same runner using the pinned toolchain and lockfiles.
          base=1a5e0a3e236cc1057304fb47c3a3a5a7a05c3837
          git fetch --no-tags --depth=1 origin "$base"
          git worktree add --detach target/td1-pr35-source "$base"
          test "$(git -C target/td1-pr35-source rev-parse HEAD)" = "$base"
          FACTSYOLO_BUILD_ID="$base" cargo build \
            --manifest-path target/td1-pr35-source/Cargo.toml \
            -p facts-yolo --release --no-default-features --features td1 \
            --target-dir "$PWD/target/td1-pr35-build" --locked --offline
      - name: Compare both real 2000-step trained artifacts through native C ABI
        if: runner.os == 'Linux'
        run: |
          python3 experiments/cpu-detector/paired_trained_native.py \
            target/td1-pr35-build/release/libfacts_yolo.so \
            target/td1-native/release/libfacts_yolo.so \
            experiments/cpu-detector/target/evidence \
            target/td1-evidence-burn target/td1-evidence-candle \
            target/td1-paired-evidence
      - name: Show command diagnostics when a gate fails
        if: failure()
        run: |
          ${{ matrix.python }} - <<'PY'
          from pathlib import Path
          import sys
          sys.stdout.reconfigure(encoding='utf-8')
          logs = [*Path('experiments/cpu-detector/target/evidence').glob('*.log'),
                  *Path('experiments/cpu-detector/target/evidence').glob('*.diagnostics.jsonl'),
                  *Path('target').glob('td1-evidence-*/*.log')]
          for log in sorted(logs):
              print(f'{log}:', flush=True)
              print('\n'.join(log.read_text(encoding='utf-8', errors='replace').splitlines()[-80:]), flush=True)
          PY
      - name: Preserve commands, losses and metrics (no weight or pixel upload)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-detector-evidence-${{ matrix.os }}
          path: |
            experiments/cpu-detector/target/evidence/**/*.json
            experiments/cpu-detector/target/evidence/**/*.log
            experiments/cpu-detector/target/evidence/**/*.jsonl
            experiments/cpu-detector/target/evidence/**/*.tsv
            target/td1-evidence-*/commands.json
            target/td1-evidence-*/summary.json
            target/td1-evidence-*/*.log
            target/td1-evidence-*/rust-layout.txt
            target/td1-evidence-*/cases/*.txt
            target/td1-paired-evidence/*.json
            target/td1-paired-evidence/*.jsonl
            target/td1-paired-evidence/*.csv
            target/td1-paired-evidence/*.log
          if-no-files-found: error
