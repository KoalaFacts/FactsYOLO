name: Native contract
on:
  pull_request:
  push:
    branches: [main, 'feat/m1-*']
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust: '1.99.0'
          - os: ubuntu-24.04
            rust: '1.85.0'
          - os: windows-2022
            rust: '1.99.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_TERM_COLOR: never
    steps:
      - name: Fetch exact public commit without credentials
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version --verbose
          cargo --version
      - name: Debug tests
        run: cargo test --workspace --locked --offline
      - name: Release tests
        run: cargo test --workspace --locked --offline --release
      - name: Build native libraries
        run: cargo build -p facts-yolo --locked --offline --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Format
        if: matrix.rust == '1.99.0'
        run: cargo fmt --all -- --check
