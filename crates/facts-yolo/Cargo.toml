[package]
name = "facts-yolo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Independent Rust vision infrastructure: experimental native contract"

[lib]
name = "facts_yolo"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
contract-fixtures = []
td1 = ["dep:fy-tiny-model"]

[dependencies]
fy-tiny-model = { path = "../../experiments/cpu-detector/model", optional = true }

[lints]
workspace = true

[[example]]
name = "resource_probe"
required-features = ["contract-fixtures"]
